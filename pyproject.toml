[project]
name = "soutui"
version = "0.1.0"
description = "Search & recommendation advertising ranking pipeline"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "jinja2>=3.1",
  "numpy>=1.24",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.0",
  "python-multipart>=0.0.9",
  "stripe>=10.0",
  "uvicorn>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]
