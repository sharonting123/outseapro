name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: soutui
          POSTGRES_PASSWORD: soutui_test
          POSTGRES_DB: soutui_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soutui -d soutui_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://soutui:soutui_test@127.0.0.1:5432/soutui_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest httpx
      - run: PYTHONPATH=src pytest -q
      - run: docker build -t soutui:${{ github.sha }} .
